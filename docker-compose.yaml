services:
  proxy:
    image: ghcr.io/szbence7/compmarket-proxy:main
    pull_policy: always
    restart: unless-stopped
    environment:
      - PORT=3000
      - PROXY_SECRET
    expose:
      - "3000"
    networks:
      default:
        aliases:
          - compmarket-proxy-production
networks:
  default:
    external: true
    name: coolify
